version: '3.8'

services:
  lottery-app:
    build: .
    image: lottery-system:latest
    container_name: lottery-system
    network_mode: "host" # 使用宿主机网络
    volumes:
      - /data/PIC:/PIC # 映射图片上传目录到宿主机
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-8888}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-localhost}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin}
      - MAIL_AUTH_CODE=${MAIL_AUTH_CODE}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DINGTALK_WEBHOOK_URL=${DINGTALK_WEBHOOK_URL}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  redis:
    image: redis:latest
    container_name: lottery-redis
    ports:
      - "8888:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
