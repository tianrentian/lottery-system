<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>创建抽奖活动</title>
    <link rel="stylesheet" href="/css/bootstrap-4.5.2.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/toastr.min.css">
    <style>
        body {
            padding: 0 32px 32px;
            background-color: var(--color-bg);
            font-family: var(--font-body);
        }
        .container {
            max-width: 680px;
            margin: 20px auto;
            padding: 32px 40px;
            background-color: var(--color-card);
            border: 2px solid var(--color-fg);
            border-radius: var(--radius-wobbly-md);
            box-shadow: 8px 8px 0px 0px var(--color-fg);
            position: relative;
        }
        /* 顶部装饰条 */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: var(--color-accent);
        }
        .h-title {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.5px;
            color: var(--color-fg);
            text-align: center;
            margin-bottom: 32px;
            margin-top: 10px;
        }
        .form-btn-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 32px;
        }
        .form-btn-box button {
            min-width: 140px;
        }
        .ai-planner-panel {
            max-width: 620px;
            margin: 18px auto 20px;
            background-color: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-wobbly-md);
            box-shadow: 3px 3px 0 var(--color-border);
            overflow: hidden;
        }
        .ai-planner-toggle {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 52px;
            padding: 12px 18px;
            background-color: transparent;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            color: var(--color-fg);
            text-align: left;
            cursor: pointer;
        }
        .ai-planner-toggle:hover {
            background-color: rgba(0, 0, 0, 0.025);
        }
        .ai-planner-panel.is-open .ai-planner-toggle {
            border-bottom: 1px dashed var(--color-border);
        }
        .ai-planner-toggle-title {
            font-family: var(--font-heading);
            font-size: 17px;
            font-weight: 700;
            white-space: nowrap;
        }
        .ai-planner-toggle-help {
            flex: 1;
            margin-left: 14px;
            color: var(--color-muted-fg);
            font-size: 12px;
        }
        .ai-planner-toggle-hint {
            margin-left: 12px;
            color: var(--color-muted-fg);
            font-size: 12px;
            white-space: nowrap;
        }
        .ai-planner-body {
            max-height: 0;
            margin: 0;
            padding: 0 18px;
            opacity: 0;
            overflow: hidden;
            pointer-events: none;
            transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
        }
        .ai-planner-panel.is-open .ai-planner-body {
            max-height: 720px;
            padding: 14px 18px 16px;
            opacity: 1;
            pointer-events: auto;
        }
        .ai-planner-title {
            margin: 0 0 8px;
            font-family: var(--font-heading);
            font-size: 20px;
            font-weight: 800;
            color: var(--color-fg);
        }
        .ai-planner-help {
            margin: 0 0 10px;
            color: var(--color-muted-fg);
            font-size: 12px;
        }
        .ai-planner-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }
        .ai-planner-actions .btn {
            min-width: 112px;
        }
        .ai-planner-status {
            min-height: 18px;
            margin-top: 10px;
            color: var(--color-muted-fg);
            font-size: 12px;
        }
        .ai-planner-status.is-error { color: #b42318; }
        .ai-planner-status.is-success { color: #18794e; }
        .ai-planner-confirm,
        .ai-planner-clarification {
            display: none;
            margin-top: 14px;
            padding: 14px;
            background: var(--color-muted);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-wobbly-sm);
        }
        .ai-planner-confirm p,
        .ai-planner-clarification p {
            margin: 0 0 10px;
            font-weight: 600;
        }
        .ai-clarification-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .ai-clarification-options button {
            border: 1px solid var(--color-border);
            border-radius: 16px;
            padding: 5px 12px;
            background: #fff;
            cursor: pointer;
        }
        .ai-clarification-options button:hover { border-color: var(--color-accent); }
        @media (max-width: 760px) {
            .container {
                margin-left: 8px;
                margin-right: 8px;
                padding-left: 20px;
                padding-right: 20px;
            }
            .ai-planner-panel { margin-left: 8px; margin-right: 8px; }
            .ai-planner-toggle { align-items: flex-start; flex-wrap: wrap; }
            .ai-planner-toggle-help { flex-basis: 100%; margin: 4px 0 0 27px; }
            .ai-planner-toggle-hint { margin-left: auto; }
            .form-btn-box { flex-wrap: wrap; }
        }
        /* 模态框样式优化 */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 18, 18, 0.72);
        }
        .modal-content {
            background-color: var(--color-card);
            margin: 6vh auto;
            padding: 0;
            border: 2px solid var(--color-fg);
            border-radius: var(--radius-wobbly);
            box-shadow: 8px 8px 0px 0px var(--color-fg);
            width: 660px;
            overflow: hidden;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 2px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--color-muted);
        }
        .modal-header h2 {
            margin: 0;
            font-family: var(--font-heading);
            font-size: 20px;
            font-weight: 800;
        }
        .close {
            color: var(--color-fg);
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            opacity: 0.6;
        }
        .close:hover {
            opacity: 1;
        }
        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-footer {
            padding: 16px 24px;
            border-top: 2px solid var(--color-border);
            background-color: var(--color-muted);
            justify-content: flex-end;
            gap: 12px;
        }
        .prize-item-header {
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--color-muted-fg);
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .prize-item, .user-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            background: #fff;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-wobbly-sm);
            padding: 8px 12px;
            transition: border-color 0.2s;
        }
        .prize-item:hover, .user-item:hover {
            border-color: var(--color-accent);
        }
        /* 列表列宽分配 */
        .col-check { width: 40px; text-align: center; }
        .col-name  { flex: 1; font-weight: 600; padding: 0 10px; }
        .col-num   { width: 100px; padding: 0 10px; }
        .col-level { width: 140px; padding: 0 10px; }
        
        .prize-item input[type="text"],
        .prize-item input[type="number"],
        .prize-item select {
            height: 36px;
            line-height: normal;
        }
        .user-item label {
            margin: 0 0 0 10px;
            cursor: pointer;
            width: 100%;
        }
        /* 页面级反馈：沿用手绘边框，但不遮挡表单，也不展示后端技术细节 */
        #toast-container.toast-top-center {
            top: 22px;
        }
        #toast-container > .toast {
            width: min(360px, calc(100vw - 32px));
            padding: 13px 18px;
            color: var(--color-fg);
            background-image: none !important;
            background-color: var(--color-card);
            border: 2px solid var(--color-fg);
            border-radius: var(--radius-wobbly-sm);
            box-shadow: 5px 5px 0 var(--color-fg);
            opacity: 1;
            font-family: var(--font-body);
        }
        #toast-container > .toast-success {
            background-color: #eff9f1;
            border-color: #18794e;
            box-shadow: 5px 5px 0 #18794e;
        }
        #toast-container > .toast-error {
            background-color: #fff1f0;
            border-color: #b42318;
            box-shadow: 5px 5px 0 #b42318;
        }
        #toast-container > .toast-warning {
            background-color: #fff8df;
            border-color: #9a6700;
            box-shadow: 5px 5px 0 #9a6700;
        }
        #toast-container .toast-title {
            margin-bottom: 3px;
            font-family: var(--font-heading);
            font-weight: 800;
        }
        #toast-container .toast-message {
            line-height: 1.5;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container overflow-hidden">
    <h2 class="h-title">🎯 创建抽奖活动</h2>
    <form id="activityForm">
        <div class="form-group">
            <label for="activityName">活动名称</label>
            <input type="text" placeholder="例如：2026年终盛典大抽奖" class="form-control" id="activityName" name="activityName" required>
        </div>
        <div class="form-group desc-row">
            <label for="description">活动描述</label>
            <textarea id="description" placeholder="请输入活动详情、规则或目的等及简要介绍" rows="4" class="form-control" name="description" required></textarea>
        </div>
        <div class="form-btn-box">
            <button id="buttonPrizes" type="button" class="btn btn-outline-primary" onclick="showPrizesModal()">1. 圈选奖品</button>
            <button id="buttonUsers" type="button" class="btn btn-outline-primary" onclick="showUsersModal()">2. 圈选人员</button>
            <button type="submit" class="btn btn-primary" id="createActivity">3. 立刻创建</button>
        </div>
    </form>
</div>

<!-- AI 活动策划助手：生成草稿并回填上方原有表单，不直接创建活动 -->
<section id="aiPlannerPanel" class="ai-planner-panel" aria-labelledby="aiPlannerTitle">
    <button id="aiPlannerToggle" type="button" class="ai-planner-toggle" aria-expanded="false" aria-controls="aiPlannerBody">
        <span id="aiPlannerTitle" class="ai-planner-toggle-title">✨ AI 活动策划助手</span>
        <span class="ai-planner-toggle-help">可选：输入活动想法，自动填写名称、描述和奖品</span>
        <span id="aiPlannerToggleHint" class="ai-planner-toggle-hint">展开使用⌄</span>
    </button>
    <div id="aiPlannerBody" class="ai-planner-body" aria-hidden="true" inert>
        <p class="ai-planner-help">描述活动场景即可，最多输入 300 字。人员仍需你手动圈选。</p>
        <textarea id="aiPlannerPrompt" class="form-control" rows="2" maxlength="300"
                  placeholder="例如：帮我策划一个热闹一点的公司年会抽奖"></textarea>
        <div class="ai-planner-actions">
            <button id="generateAiPlan" type="button" class="btn btn-outline-primary">生成活动方案</button>
        </div>
        <div id="aiPlannerStatus" class="ai-planner-status" role="status"></div>
        <div id="aiPlannerConfirm" class="ai-planner-confirm">
            <p>当前表单已有内容，继续生成会覆盖活动名称、描述和已选奖品，是否继续？</p>
            <div class="ai-planner-actions">
                <button id="confirmApplyAiPlan" type="button" class="btn btn-primary">继续生成</button>
                <button id="cancelApplyAiPlan" type="button" class="btn btn-secondary">取消</button>
            </div>
        </div>
        <div id="aiPlannerClarification" class="ai-planner-clarification">
            <p id="aiClarificationQuestion"></p>
            <div id="aiClarificationOptions" class="ai-clarification-options"></div>
            <textarea id="aiClarificationAnswer" class="form-control" rows="2" maxlength="100"
                      placeholder="也可以直接补充你的选择"></textarea>
            <div class="ai-planner-actions">
                <button id="submitAiClarification" type="button" class="btn btn-primary">继续策划</button>
            </div>
        </div>
    </div>
</section>

<!-- 奖品选择模态框 -->
<div id="prizesModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>选择可用奖品</h2>
            <span class="close" onclick="hidePrizesModal()">&times;</span>
        </div>
        <div class="modal-body" id="prizesContainer">
            <!-- 奖品列表将动态插入 -->
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="hidePrizesModal()">取消</button>
            <button type="button" class="btn btn-primary" onclick="submitPrizes()">确认选择</button>
        </div>
    </div>
</div>

<!-- 人员选择模态框 -->
<div id="usersModal" class="modal">
    <div class="modal-content modal-users">
        <div class="modal-header">
            <h2>选择参与人员</h2>
            <span class="close" onclick="hideUsersModal()">&times;</span>
        </div>
        <div class="modal-body" id="usersContainer">
            <!-- 人员列表将动态插入 -->
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="hideUsersModal()">取消</button>
            <button type="button" class="btn btn-primary" onclick="submitUsers()">确认选择</button>
        </div>
    </div>
</div>

<script src="/js/jquery-3.6.0.min.js"></script>
<script src="/js/jquery.validate-1.19.3.min.js"></script>
<script src="/js/toastr-2.1.4.min.js"></script>
<script>
    var userToken = localStorage.getItem("user_token");
    var selectedPrizes = [];
    var selectedUsers = [];
    var idempotentToken = null;
    var isSubmitting = false;
    var aiPlannerSessionId = sessionStorage.getItem('aiPlannerSessionId');
    var pendingAiPlan = null;

    toastr.options = {
        closeButton: true,
        newestOnTop: true,
        positionClass: 'toast-top-center',
        preventDuplicates: true,
        timeOut: 3200,
        extendedTimeOut: 800,
        showDuration: 180,
        hideDuration: 180
    };

    function showPageMessage(type, message, title) {
        var notifier = toastr[type] || toastr.info;
        notifier(message, title || '');
    }

    function friendlyCreateError(message) {
        if (!message || message === '系统异常') {
            return '活动创建失败，请稍后重试。';
        }
        return message;
    }

    function readAiField(object, snakeName, camelName) {
        if (!object) return null;
        return object[snakeName] !== undefined ? object[snakeName] : object[camelName];
    }

    function setAiStatus(message, type) {
        var $status = $('#aiPlannerStatus');
        $status.removeClass('is-error is-success');
        if (type) $status.addClass('is-' + type);
        $status.text(message || '');
    }

    function setAiPlannerExpanded(expanded) {
        var $panel = $('#aiPlannerPanel');
        var $body = $('#aiPlannerBody');
        var collapseTimer = $body.data('collapseTimer');
        if (collapseTimer) {
            clearTimeout(collapseTimer);
            $body.removeData('collapseTimer');
        }
        if (expanded) {
            $body.prop('hidden', false).prop('inert', false).attr('aria-hidden', 'false');
            $panel.addClass('is-open');
        } else {
            $body.prop('inert', true).attr('aria-hidden', 'true');
            $panel.removeClass('is-open');
            $body.data('collapseTimer', setTimeout(function() {
                if ($('#aiPlannerToggle').attr('aria-expanded') !== 'true') {
                    $body.prop('hidden', true);
                }
            }, 260));
        }
        $('#aiPlannerToggle').attr('aria-expanded', expanded ? 'true' : 'false');
        $('#aiPlannerToggleHint').text(expanded ? '收起⌃' : '展开使用⌄');
    }

    function hideAiPanels() {
        $('#aiPlannerConfirm, #aiPlannerClarification').hide();
    }

    function hasExistingAiOverwriteTarget() {
        return $.trim($('#activityName').val()).length > 0
            || $.trim($('#description').val()).length > 0
            || selectedPrizes.length > 0;
    }

    function showAiClarification(response) {
        setAiPlannerExpanded(true);
        var question = readAiField(response, 'clarification_question', 'clarificationQuestion');
        var options = readAiField(response, 'clarification_options', 'clarificationOptions') || [];
        $('#aiClarificationQuestion').text(question || '请补充你的活动要求');
        var $options = $('#aiClarificationOptions').empty();
        options.forEach(function(option) {
            $('<button type="button"></button>').text(option).on('click', function() {
                $('#aiClarificationAnswer').val(option);
            }).appendTo($options);
        });
        $('#aiPlannerClarification').show();
        setAiStatus('需要你确认一个活动条件后才能继续。');
    }

    function syncPrizeModalSelection() {
        $('.prize-item input[type="checkbox"]').prop('checked', false);
        selectedPrizes.forEach(function(item) {
            var prizeId = item.prizeId;
            $('#prize-' + prizeId).prop('checked', true);
            $('input[name="quantity-' + prizeId + '"]').val(item.prizeAmount);
            $('select[name="level-' + prizeId + '"]').val(item.prizeTiers);
        });
    }

    function applyAiPlan(response) {
        var draft = response && response.draft;
        if (!draft) {
            setAiStatus('AI没有返回可用方案，请稍后重试。', 'error');
            return;
        }
        $('#activityName').val(readAiField(draft, 'activity_name', 'activityName') || '');
        $('#description').val(draft.description || '');
        selectedPrizes = (draft.prizes || []).map(function(item) {
            return {
                prizeId: Number(readAiField(item, 'prize_id', 'prizeId')),
                prizeAmount: Number(readAiField(item, 'prize_amount', 'prizeAmount')),
                prizeTiers: readAiField(item, 'prize_tiers', 'prizeTiers')
            };
        }).filter(function(item) {
            return item.prizeId > 0 && item.prizeAmount > 0 && item.prizeTiers;
        });
        $('#buttonPrizes').text(selectedPrizes.length > 0
            ? `圈选奖品 (已选 ${selectedPrizes.length})`
            : '1. 圈选奖品');
        syncPrizeModalSelection();
        pendingAiPlan = null;
        hideAiPanels();
        var warnings = response.warnings || [];
        if (warnings.length > 0) {
            setAiStatus(warnings.join('；') + ' 请检查后圈选人员。', 'error');
        } else if (response.status === 'NEEDS_MANUAL') {
            setAiStatus('AI方案已生成，部分配置需要人工确认。请检查后圈选人员。', 'error');
        } else {
            setAiStatus('AI方案已回填，请圈选人员后点击原来的“3. 立刻创建”。', 'success');
        }
    }

    function handleAiPlanResponse(response) {
        if (!response) {
            setAiStatus('AI没有返回方案，请稍后重试。', 'error');
            return;
        }
        if (response.session_id || response.sessionId) {
            aiPlannerSessionId = response.session_id || response.sessionId;
            sessionStorage.setItem('aiPlannerSessionId', aiPlannerSessionId);
        }
        if (response.status === 'WAITING_USER') {
            showAiClarification(response);
            return;
        }
        if (hasExistingAiOverwriteTarget()) {
            pendingAiPlan = response;
            $('#aiPlannerConfirm').show();
            setAiStatus('方案已生成，确认后才会覆盖当前表单。');
        } else {
            applyAiPlan(response);
        }
    }

    function requestAiPlan(clarificationAnswer) {
        var prompt = $.trim($('#aiPlannerPrompt').val());
        if (!prompt) {
            setAiStatus('请先输入活动场景。', 'error');
            return;
        }
        if (prompt.length > 300) {
            setAiStatus('活动场景不能超过300字。', 'error');
            return;
        }
        hideAiPanels();
        setAiStatus('正在生成并校验活动方案，请稍候…');
        $('#generateAiPlan, #submitAiClarification').prop('disabled', true);
        $.ajax({
            url: '/ai/activity-plan',
            type: 'POST',
            contentType: 'application/json',
            dataType: 'json',
            data: JSON.stringify({
                prompt: prompt,
                clarificationAnswer: clarificationAnswer || null,
                sessionId: aiPlannerSessionId || null
            }),
            headers: { "user_token": userToken },
            success: function(result) {
                if (result.code !== 200) {
                    setAiStatus(result.msg || 'AI策划失败，请稍后重试。', 'error');
                    return;
                }
                handleAiPlanResponse(result.data);
            },
            error: function(err) {
                if (err && err.status === 401) {
                    showPageMessage('warning', '登录状态已失效，请重新登录。', '需要登录');
                    window.parent.location.href = '/blogin.html';
                } else {
                    setAiStatus('AI策划服务暂时不可用，请稍后重试。', 'error');
                }
            },
            complete: function() {
                $('#generateAiPlan, #submitAiClarification').prop('disabled', false);
            }
        });
    }

    function restoreAiPlan() {
        if (!aiPlannerSessionId) return;
        $.ajax({
            url: '/ai/activity-plan/' + encodeURIComponent(aiPlannerSessionId),
            type: 'GET',
            dataType: 'json',
            headers: { "user_token": userToken },
            success: function(result) {
                if (result.code === 200 && result.data) {
                    setAiPlannerExpanded(true);
                    handleAiPlanResponse(result.data);
                    if (result.data.status !== 'WAITING_USER') {
                        setAiStatus('已恢复30分钟内的 AI 草稿，请检查后继续。', 'success');
                    }
                }
            }
        });
    }

    // 显示隐藏模态框
    function showPrizesModal() {
        $('#prizesModal').css('display', 'block');
        syncPrizeModalSelection();
    }
    function hidePrizesModal() { $('#prizesModal').css('display', 'none'); }
    function showUsersModal() { $('#usersModal').css('display', 'block'); }
    function hideUsersModal() { $('#usersModal').css('display', 'none'); }

    // 获取奖品列表
    function fetchPrizes() {
        $.ajax({
            url: '/prize/find-list',
            type: 'GET',
            dataType: 'json',
            data: { currentPage: 1, pageSize: 100},
            headers: { "user_token": userToken },
            success: function(result) {
                var prizes = result.data.records;
                var html = `
                    <div class="prize-item-header">
                        <div class="col-check">勾选</div>
                        <div class="col-name">奖品名称</div>
                        <div class="col-num">数量</div>
                        <div class="col-level">奖品等级</div>
                    </div>
                `;
                prizes.forEach(function(prize) {
                    html += `
                        <div class="prize-item">
                            <div class="col-check">
                                <input type="checkbox" id="prize-${prize.prizeId}" value="${prize.prizeId}">
                            </div>
                            <div class="col-name">
                                <label for="prize-${prize.prizeId}" style="margin:0;cursor:pointer;">${prize.prizeName}</label>
                            </div>
                            <div class="col-num">
                                <input class="form-control" type="number" name="quantity-${prize.prizeId}" min="1" value="1">
                            </div>
                            <div class="col-level">
                                <select class="form-control" name="level-${prize.prizeId}">
                                    <option value="FIRST_PRIZE" selected>一等奖</option>
                                    <option value="SECOND_PRIZE">二等奖</option>
                                    <option value="THIRD_PRIZE">三等奖</option>
                                </select>
                            </div>
                        </div>
                    `;
                });
                $('#prizesContainer').html(html);
                syncPrizeModalSelection();
            },
            error: function(err){
                if(err!=null && err.status==401) {
                    showPageMessage('warning', '登录状态已失效，请重新登录。', '需要登录');
                    window.parent.location.href = "/blogin.html";
                }
            }
        });
    }

    function submitPrizes() {
        selectedPrizes = [];
        $('.prize-item input[type="checkbox"]:checked').each(function() {
            var prizeId = +$(this).val();
            var prizeAmount = +$('input[name="quantity-' + prizeId + '"]').val();
            var prizeTiers = $('select[name="level-' + prizeId + '"]').val();
            selectedPrizes.push({ prizeId: prizeId, prizeAmount: prizeAmount, prizeTiers: prizeTiers });
        });
        hidePrizesModal();
        $('#buttonPrizes').text(selectedPrizes.length > 0 ? `圈选奖品 (已选 ${selectedPrizes.length})` : '1. 圈选奖品');
    }

    // 获取人员列表
    function fetchUsers() {
        $.ajax({
            url: '/base-user/find-list',
            type: 'GET',
            dataType: 'json',
            data: { identity: 'NORMAL' },
            headers: { "user_token": userToken },
            success: function(result) {
                var users = result.data;
                var html = '';
                users.forEach(function(user) {
                    html += `
                        <div class="user-item">
                            <input type="checkbox" id="user-${user.userId}" value="${user.userId}">
                            <label for="user-${user.userId}">${user.userName}</label>
                        </div>
                    `;
                });
                $('#usersContainer').html(html);
            }
        });
    }

    function submitUsers() {
        selectedUsers = [];
        $('.user-item input[type="checkbox"]:checked').each(function() {
            var userId = +$(this).val();
            var userName = $(this).next('label').text();
            selectedUsers.push({ userId: userId, userName: userName });
        });
        hideUsersModal();
        $('#buttonUsers').text(selectedUsers.length > 0 ? `圈选人员 (已选 ${selectedUsers.length})` : '2. 圈选人员');
    }

    // 获取幂等性token
    function fetchIdempotentToken() {
        $.ajax({
            url: '/activity/create-token',
            type: 'GET',
            headers: { "user_token": userToken },
            success: function(result) {
                if (result.code === 200) {
                    idempotentToken = result.data;
                }
            }
        });
    }

    // 表单提交
    $('#createActivity').click(function(event){
        event.stopPropagation();
        
        // 防止重复提交
        if (isSubmitting) {
            showPageMessage('warning', '正在创建活动，请勿重复点击。');
            return false;
        }
        
        $('#activityForm').validate({
            rules:{ activityName: "required", description: "required" },
            messages:{ activityName: "请输入活动名称", description: "请输入活动描述" },
            submitHandler: function(form){
                if (selectedPrizes.length == 0) {
                    showPageMessage('warning', '请至少选择一个奖品。');
                    return false;
                }
                if (selectedUsers.length == 0) {
                    showPageMessage('warning', '请至少选择一名参与人员，且人员数量不能少于奖品总量。');
                    return false;
                }
                
                // 标记正在提交，禁用按钮
                isSubmitting = true;
                var $btn = $('#createActivity');
                $btn.prop('disabled', true).text('创建中...');
                
                var data = {
                    activityName: $('#activityName').val(),
                    description: $('#description').val(),
                    activityPrizeList: selectedPrizes,
                    activityUserList: selectedUsers
                };
                
                $.ajax({
                    url: '/activity/create',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    headers: { 
                        "user_token": userToken,
                        "Idempotent-Token": idempotentToken
                    },
                    success: function(result) {
                        if (result.code != 200) {
                            showPageMessage('error', friendlyCreateError(result.msg), '创建失败');
                            // 重置状态，允许重新提交
                            isSubmitting = false;
                            $btn.prop('disabled', false).text('3. 立刻创建');
                            // 重新获取token
                            fetchIdempotentToken();
                        } else {
                            showPageMessage('success', '活动已创建，可以在活动列表中查看。', '创建成功');
                            window.parent.postMessage({ from: 'activities-list.html', id: '#activitiesList' }, '*');
                        }
                    },
                    error: function() {
                        showPageMessage('error', '网络连接异常，请稍后重试。', '创建失败');
                        // 重置状态
                        isSubmitting = false;
                        $btn.prop('disabled', false).text('3. 立刻创建');
                        // 重新获取token
                        fetchIdempotentToken();
                    }
                });
            }
        });
    });

    $('#aiPlannerToggle').click(function() {
        var expanded = $('#aiPlannerToggle').attr('aria-expanded') !== 'true';
        setAiPlannerExpanded(expanded);
    });
    $('#generateAiPlan').click(function() {
        setAiPlannerExpanded(true);
        requestAiPlan(null);
    });
    $('#confirmApplyAiPlan').click(function() {
        if (pendingAiPlan) applyAiPlan(pendingAiPlan);
    });
    $('#cancelApplyAiPlan').click(function() {
        pendingAiPlan = null;
        $('#aiPlannerConfirm').hide();
        setAiStatus('已取消覆盖，当前表单内容保持不变。');
    });
    $('#submitAiClarification').click(function() {
        var answer = $.trim($('#aiClarificationAnswer').val());
        if (!answer) {
            setAiStatus('请选择或补充一个答案。', 'error');
            return;
        }
        requestAiPlan(answer);
    });

    $(document).ready(function() {
        fetchIdempotentToken();
        fetchPrizes();
        fetchUsers();
        restoreAiPlan();
    });
</script>
</body>
</html>
