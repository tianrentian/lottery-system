<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>创建抽奖活动</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/toastr.min.css">
    <style>
        body {
            padding: 0 32px 32px;
            background-color: var(--color-bg);
            font-family: var(--font-body);
        }
        .container {
            max-width: 680px;
            margin: 20px auto;
            padding: 32px 40px;
            background-color: var(--color-card);
            border: 2px solid var(--color-fg);
            border-radius: var(--radius-lg);
            box-shadow: 8px 8px 0px 0px var(--color-fg);
            position: relative;
        }
        /* 顶部装饰条 */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #F472B6, #8B5CF6, #34D399, #FBBF24);
        }
        .h-title {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.5px;
            color: var(--color-fg);
            text-align: center;
            margin-bottom: 32px;
            margin-top: 10px;
        }
        .form-btn-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 32px;
        }
        .form-btn-box button {
            min-width: 140px;
        }
        /* 模态框样式优化 */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background-color: var(--color-card);
            margin: 6vh auto;
            padding: 0;
            border: 2px solid var(--color-fg);
            border-radius: var(--radius-lg);
            box-shadow: 8px 8px 0px 0px var(--color-fg);
            width: 660px;
            overflow: hidden;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 2px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--color-muted);
        }
        .modal-header h2 {
            margin: 0;
            font-family: var(--font-heading);
            font-size: 20px;
            font-weight: 800;
        }
        .close {
            color: var(--color-fg);
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            opacity: 0.6;
        }
        .close:hover {
            opacity: 1;
        }
        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-footer {
            padding: 16px 24px;
            border-top: 2px solid var(--color-border);
            background-color: var(--color-muted);
            justify-content: flex-end;
            gap: 12px;
        }
        .prize-item-header {
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--color-muted-fg);
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .prize-item, .user-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            background: #fff;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            transition: border-color 0.2s;
        }
        .prize-item:hover, .user-item:hover {
            border-color: var(--color-accent);
        }
        /* 列表列宽分配 */
        .col-check { width: 40px; text-align: center; }
        .col-name  { flex: 1; font-weight: 600; padding: 0 10px; }
        .col-num   { width: 100px; padding: 0 10px; }
        .col-level { width: 140px; padding: 0 10px; }
        
        .prize-item input[type="text"],
        .prize-item input[type="number"],
        .prize-item select {
            height: 36px;
            line-height: normal;
        }
        .user-item label {
            margin: 0 0 0 10px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="container overflow-hidden">
    <h2 class="h-title">🎯 创建抽奖活动</h2>
    <form id="activityForm">
        <div class="form-group">
            <label for="activityName">活动名称</label>
            <input type="text" placeholder="例如：2026年终盛典大抽奖" class="form-control" id="activityName" name="activityName" required>
        </div>
        <div class="form-group desc-row">
            <label for="description">活动描述</label>
            <textarea id="description" placeholder="请输入活动详情、规则或目的等及简要介绍" rows="4" class="form-control" name="description" required></textarea>
        </div>
        <div class="form-btn-box">
            <button id="buttonPrizes" type="button" class="btn btn-outline-primary" onclick="showPrizesModal()">1. 圈选奖品</button>
            <button id="buttonUsers" type="button" class="btn btn-outline-primary" onclick="showUsersModal()">2. 圈选人员</button>
            <button type="submit" class="btn btn-primary" id="createActivity">3. 立刻创建</button>
        </div>
    </form>
</div>

<!-- 奖品选择模态框 -->
<div id="prizesModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>选择可用奖品</h2>
            <span class="close" onclick="hidePrizesModal()">&times;</span>
        </div>
        <div class="modal-body" id="prizesContainer">
            <!-- 奖品列表将动态插入 -->
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="hidePrizesModal()">取消</button>
            <button type="button" class="btn btn-primary" onclick="submitPrizes()">确认选择</button>
        </div>
    </div>
</div>

<!-- 人员选择模态框 -->
<div id="usersModal" class="modal">
    <div class="modal-content modal-users">
        <div class="modal-header">
            <h2>选择参与人员</h2>
            <span class="close" onclick="hideUsersModal()">&times;</span>
        </div>
        <div class="modal-body" id="usersContainer">
            <!-- 人员列表将动态插入 -->
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="hideUsersModal()">取消</button>
            <button type="button" class="btn btn-primary" onclick="submitUsers()">确认选择</button>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/jquery-validate/1.19.3/jquery.validate.min.js"></script>
<script src="./js/toastr.min.js"></script>
<script>
    var userToken = localStorage.getItem("user_token");
    var selectedPrizes = [];
    var selectedUsers = [];
    var idempotentToken = null;
    var isSubmitting = false;

    // 显示隐藏模态框
    function showPrizesModal() { $('#prizesModal').css('display', 'block'); }
    function hidePrizesModal() { $('#prizesModal').css('display', 'none'); }
    function showUsersModal() { $('#usersModal').css('display', 'block'); }
    function hideUsersModal() { $('#usersModal').css('display', 'none'); }

    // 获取奖品列表
    function fetchPrizes() {
        $.ajax({
            url: '/prize/find-list',
            type: 'GET',
            dataType: 'json',
            data: { currentPage: 1, pageSize: 100},
            headers: { "user_token": userToken },
            success: function(result) {
                var prizes = result.data.records;
                var html = `
                    <div class="prize-item-header">
                        <div class="col-check">勾选</div>
                        <div class="col-name">奖品名称</div>
                        <div class="col-num">数量</div>
                        <div class="col-level">奖品等级</div>
                    </div>
                `;
                prizes.forEach(function(prize) {
                    html += `
                        <div class="prize-item">
                            <div class="col-check">
                                <input type="checkbox" id="prize-${prize.prizeId}" value="${prize.prizeId}">
                            </div>
                            <div class="col-name">
                                <label for="prize-${prize.prizeId}" style="margin:0;cursor:pointer;">${prize.prizeName}</label>
                            </div>
                            <div class="col-num">
                                <input class="form-control" type="number" name="quantity-${prize.prizeId}" min="1" value="1">
                            </div>
                            <div class="col-level">
                                <select class="form-control" name="level-${prize.prizeId}">
                                    <option value="FIRST_PRIZE" selected>一等奖</option>
                                    <option value="SECOND_PRIZE">二等奖</option>
                                    <option value="THIRD_PRIZE">三等奖</option>
                                    <option value="FOURTH_PRIZE">幸运奖</option>
                                </select>
                            </div>
                        </div>
                    `;
                });
                $('#prizesContainer').html(html);
            },
            error: function(err){
                if(err!=null && err.status==401) {
                    alert("用户未登录!");
                    window.parent.location.href = "/blogin.html";
                }
            }
        });
    }

    function submitPrizes() {
        selectedPrizes = [];
        $('.prize-item input[type="checkbox"]:checked').each(function() {
            var prizeId = +$(this).val();
            var prizeAmount = +$('input[name="quantity-' + prizeId + '"]').val();
            var prizeTiers = $('select[name="level-' + prizeId + '"]').val();
            selectedPrizes.push({ prizeId: prizeId, prizeAmount: prizeAmount, prizeTiers: prizeTiers });
        });
        hidePrizesModal();
        $('#buttonPrizes').text(selectedPrizes.length > 0 ? `圈选奖品 (已选 ${selectedPrizes.length})` : '1. 圈选奖品');
    }

    // 获取人员列表
    function fetchUsers() {
        $.ajax({
            url: '/base-user/find-list',
            type: 'GET',
            dataType: 'json',
            data: { identity: 'NORMAL' },
            headers: { "user_token": userToken },
            success: function(result) {
                var users = result.data;
                var html = '';
                users.forEach(function(user) {
                    html += `
                        <div class="user-item">
                            <input type="checkbox" id="user-${user.userId}" value="${user.userId}">
                            <label for="user-${user.userId}">${user.userName}</label>
                        </div>
                    `;
                });
                $('#usersContainer').html(html);
            }
        });
    }

    function submitUsers() {
        selectedUsers = [];
        $('.user-item input[type="checkbox"]:checked').each(function() {
            var userId = +$(this).val();
            var userName = $(this).next('label').text();
            selectedUsers.push({ userId: userId, userName: userName });
        });
        hideUsersModal();
        $('#buttonUsers').text(selectedUsers.length > 0 ? `圈选人员 (已选 ${selectedUsers.length})` : '2. 圈选人员');
    }

    // 获取幂等性token
    function fetchIdempotentToken() {
        $.ajax({
            url: '/activity/create-token',
            type: 'GET',
            headers: { "user_token": userToken },
            success: function(result) {
                if (result.code === 200) {
                    idempotentToken = result.data;
                }
            }
        });
    }

    // 表单提交
    $('#createActivity').click(function(event){
        event.stopPropagation();
        
        // 防止重复提交
        if (isSubmitting) {
            alert('正在创建中，请勿重复点击！');
            return false;
        }
        
        $('#activityForm').validate({
            rules:{ activityName: "required", description: "required" },
            messages:{ activityName: "请输入活动名称", description: "请输入活动描述" },
            submitHandler: function(form){
                if (selectedPrizes.length == 0) { alert('请至少选择一个奖品'); return false; }
                if (selectedUsers.length == 0) { alert('请至少选择一个人员, 人员数量应大于等于奖品总量'); return false; }
                
                // 标记正在提交，禁用按钮
                isSubmitting = true;
                var $btn = $('#createActivity');
                $btn.prop('disabled', true).text('创建中...');
                
                var data = {
                    activityName: $('#activityName').val(),
                    description: $('#description').val(),
                    activityPrizeList: selectedPrizes,
                    activityUserList: selectedUsers
                };
                
                $.ajax({
                    url: '/activity/create',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    headers: { 
                        "user_token": userToken,
                        "Idempotent-Token": idempotentToken
                    },
                    success: function(result) {
                        if (result.code != 200) {
                            alert("创建失败！" + result.msg);
                            // 重置状态，允许重新提交
                            isSubmitting = false;
                            $btn.prop('disabled', false).text('3. 立刻创建');
                            // 重新获取token
                            fetchIdempotentToken();
                        } else {
                            alert("创建成功!");
                            window.parent.postMessage({ from: 'activities-list.html', id: '#activitiesList' }, '*');
                        }
                    },
                    error: function() {
                        alert("网络错误，请稍后重试！");
                        // 重置状态
                        isSubmitting = false;
                        $btn.prop('disabled', false).text('3. 立刻创建');
                        // 重新获取token
                        fetchIdempotentToken();
                    }
                });
            }
        });
    });

    $(document).ready(function() {
        fetchIdempotentToken();
        fetchPrizes();
        fetchUsers();
    });
</script>
</body>
</html>
