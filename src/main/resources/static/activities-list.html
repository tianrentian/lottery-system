<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>活动列表</title>
  <link rel="stylesheet" href="/css/bootstrap-4.5.2.min.css">
  <link rel="stylesheet" href="./css/base.css">
  <style>
    body {
      background-color: var(--color-bg);
      padding: 0 32px 32px;
      font-family: var(--font-body);
    }
    .activity-list h2 {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 24px;
      color: var(--color-fg);
      height: 80px;
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    #activities {
      height: calc(100vh - 150px);
      overflow-y: auto;
      padding-right: 12px;
    }
    /* 隐藏滚动条但保留功能 */
    #activities::-webkit-scrollbar {
      width: 8px;
    }
    #activities::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 4px;
    }
    .activity-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 28px;
      margin-bottom: 16px;
      transition: all 0.25s var(--ease-bounce);
      border-radius: var(--radius-wobbly);
    }
    .activity-info {
      width: calc(100% - 160px);
    }
    .activity-info h4 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 18px;
      color: var(--color-fg);
      margin-bottom: 8px;
    }
    .activity-info p {
      font-weight: 400;
      font-size: 14px;
      color: var(--color-muted-fg);
      margin: 0;
      line-height: 1.6;
    }
    .status-action {
      text-align: right;
    }
    .btn-draw-active {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #fff;
      color: var(--color-fg) !important;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: var(--radius-wobbly);
      border: 2px solid var(--color-fg);
      box-shadow: 3px 3px 0px var(--color-fg);
      transition: all 0.2s var(--ease-bounce);
      font-size: 14px;
      min-width: 140px;
    }
    .btn-draw-active:hover {
      background-color: var(--color-accent);
      color: #fff !important;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--color-fg);
      text-decoration: none;
    }
    .btn-draw-inactive {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-muted);
      color: var(--color-muted-fg) !important;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: var(--radius-wobbly);
      border: 2px solid var(--color-fg);
      transition: all 0.2s;
      font-size: 14px;
      min-width: 140px;
    }
    .btn-draw-inactive:hover {
      background-color: #E2E8F0;
      text-decoration: none;
    }
  </style>
</head>
<body>
<div class="activity-list">
  <h2>活动列表</h2>
  <div id="activities">
    <!-- 活动列表将动态插入这里 -->
  </div>
  <div class="pagination">
    <button onclick="fetchActivities(1)">首页</button>
    <button onclick="previousPage()">上一页</button>
    <span>第 <input type="number" id="pageInput" min="1" value="1" /> 页</span>
    <button onclick="nextPage()">下一页</button>
    <button onclick="fetchActivities(totalPages)">尾页</button>
  </div>
</div>

<script src="/js/jquery-3.6.0.min.js"></script>
<script src="/js/toastr-2.1.4.min.js"></script>
<script>
    var currentPage = 1;
    var pageSize = 10;
    var totalPages;
    var userToken = localStorage.getItem("user_token");

    function fetchActivities(page) {
      if (page < 1) page = 1;
      currentPage = page;
      var dataToSend = { currentPage: currentPage, pageSize: pageSize };

      $.ajax({
          url: '/activity/find-list',
          type: 'GET',
          data: dataToSend,
          dataType: 'json',
          headers: { "user_token": userToken },
          success: function(result) {
            if (result.code != 200) {
                alert("查询活动列表失败！" + result.msg);
            } else {
                var activities = result.data.records;
                var activitiesHtml = '';
                var listContainer = document.getElementById('activities');
                listContainer.innerHTML = '';
                activities.forEach(function(activity) {
                  var url = 'draw.html?activityName='+ encodeURIComponent(activity.activityName)
                          +'&activityId=' + encodeURIComponent(activity.activityId)
                          +'&valid=' + encodeURIComponent(activity.valid);
                  
                  var linkTextActive = `<a href="${url}" target="_blank" class="btn-draw-active">🎲 去抽奖</a>`;
                  var linkTextInactive = `<a href="${url}" target="_blank" class="btn-draw-inactive">查看中奖名单</a>`;
                  var link = activity.valid ? linkTextActive : linkTextInactive;
                  
                  activitiesHtml += `
                      <div class="activity-item geo-card">
                        <div class="activity-info">
                          <h4>${activity.activityName}</h4>
                          <p>${activity.description}</p>
                        </div>
                        <div class="status-action">
                          ${link}
                        </div>
                      </div>
                    `;
                });
                $('#activities').html(activitiesHtml);
                totalPages = Math.ceil(result.data.total / pageSize);
                $('#pageInput').val(currentPage);
              }
          },
        error:function(err){
          if(err!=null && err.status==401){
            alert("用户未登录, 即将跳转到登录页!");
            window.location.href = "/blogin.html";
            window.parent.location.href = "/blogin.html";
          }
        }
      });
    }

    function previousPage() {
      if (currentPage > 1) fetchActivities(currentPage - 1);
      else alert("已经是第一页");
    }

    function nextPage() {
      if (currentPage < totalPages) fetchActivities(currentPage + 1);
      else alert("已经是最后一页");
    }

    $(document).ready(function() {
      fetchActivities(1);
    });

    $('#pageInput').on('keypress', function(e) {
      if (e.key === 'Enter') {
        var page = parseInt(this.value);
        if (page > totalPages) {
          page = totalPages;
          $('#pageInput').val(totalPages);
        }
        if (!isNaN(page) && page >= 1 && page <= totalPages) {
          fetchActivities(page);
        }
      }
    });
</script>
</body>
</html>
