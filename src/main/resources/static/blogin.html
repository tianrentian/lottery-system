<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>管理员登录 - 抽奖系统</title>
  <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/login.css">
  <link rel="stylesheet" href="./css/toastr.min.css">
</head>
<body class="login-page">

<!-- 登录框区域 -->
<div class="login-box row">
  <!-- 左侧装饰区 -->
  <div class="img-box col-sm-6 col-md-6 col-lg-7 col-xl-7">
    <!-- 用几何 SVG 替代原图片 -->
    <svg width="100%" height="100%" viewBox="0 0 400 360" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width:380px; position:relative; z-index:1;">
      <!-- 大圆 -->
      <circle cx="200" cy="180" r="140" fill="#2d5da1" opacity="0.15" stroke="#2d5da1" stroke-width="3"/>
      <!-- 骰子/彩票图标（几何化）-->
      <rect x="120" y="100" width="160" height="160" fill="white" stroke="#121212" stroke-width="3"/>
      <rect x="120" y="100" width="160" height="160" rx="24" fill="white"/>
      <!-- 骰子点 -->
      <circle cx="165" cy="145" r="14" fill="#2d5da1"/>
      <circle cx="235" cy="145" r="14" fill="#ff4d4d"/>
      <circle cx="165" cy="180" r="14" fill="#FBBF24"/>
      <circle cx="235" cy="180" r="14" fill="#2d5da1"/>
      <circle cx="165" cy="215" r="14" fill="#ff4d4d"/>
      <circle cx="235" cy="215" r="14" fill="#2d5da1"/>
      <!-- 卡片描边 -->
      <rect x="120" y="100" width="160" height="160" fill="none" stroke="#121212" stroke-width="3"/>
      <!-- 硬阴影 -->
      <rect x="127" y="107" width="160" height="160" fill="none" stroke="#121212" stroke-width="3" opacity="0.15"/>
      <!-- 装饰小圆 -->
      <circle cx="80" cy="80" r="20" fill="#fff9c4" stroke="#2d2d2d" stroke-width="2"/>
      <circle cx="320" cy="280" r="28" fill="#ff4d4d" stroke="#2d2d2d" stroke-width="2"/>
      <circle cx="340" cy="100" r="14" fill="#ff4d4d" stroke="#2d2d2d" stroke-width="2"/>
      <!-- 小星形（三角）-->
      <polygon points="60,250 75,220 90,250" fill="#2d5da1" stroke="#2d2d2d" stroke-width="2"/>
    </svg>
    <!-- 左侧标语 -->
    <div style="margin-top: 28px; position: relative; z-index: 1; text-align: center;">
      <p style="font-family: var(--font-heading); font-size: 22px; font-weight: 700; color: #ff4d4d; margin: 0; letter-spacing: 0;">抽出你的惊喜 🎲</p>
      <p style="font-family: var(--font-body); font-size: 15px; color: #2d5da1; margin-top: 6px; opacity: 0.8;">公平 · 透明 · 高效的企业抽奖平台</p>
    </div>
  </div>

  <!-- 右侧登录区 -->
  <div class="login-container col-sm-6 col-md-6 col-lg-5 col-xl-5">
    <h2>管理员登录</h2>

    <!-- Tab 切换 -->
    <div class="tab-box">
      <span class="active tab-span" data-form="loginForm">🔑 密码登录</span>
      <span class="tab-span" data-form="codeForm">📱 验证码登录</span>
    </div>

    <!-- 密码登录表单 -->
    <form id="loginForm">
      <!-- 面试官提示框 -->
      <div style="background-color: #FEF3C7; border: 2px dashed #F59E0B; border-radius: 8px; padding: 12px; margin-bottom: 16px; text-align: center; color: #B45309; font-size: 14px; font-weight: 600;">
        👋 面试官您好！欢迎体验<br>
        可用测试账号：<span style="background: #121212; color: #FFF; padding: 2px 6px; margin: 0 4px;">13812345678</span>密码：<span style="background: #121212; color: #FFF; padding: 2px 6px; margin: 0 4px;">123456</span>
      </div>
      
      <div class="form-group">
        <label for="phoneNumber">手机号</label>
        <input class="form-control" type="text" id="phoneNumber" name="phoneNumber" required placeholder="请输入手机号">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input class="form-control" type="password" id="password" name="password" required placeholder="请输入密码">
      </div>
      <button type="submit" class="btn btn-primary btn-block login-btn">登录系统</button>
      <div class="error" style="color: var(--color-error); font-size: 13px; margin-top: 8px;"></div>
    </form>

    <!-- 验证码登录表单 -->
    <form id="codeForm" style="display: none;">
      <div class="form-group">
        <label for="loginMobile">手机号</label>
        <input class="form-control" type="text" id="loginMobile" name="loginMobile" required placeholder="请输入手机号">
      </div>
      <div class="form-group">
        <label for="verificationCode">验证码</label>
        <div class="code-box">
          <input class="form-control" type="text" id="verificationCode" name="verificationCode" required placeholder="请输入验证码">
          <div class="btn btn-primary" id="getVerificationCode">获取验证码</div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block login-btn">登录系统</button>
      <div class="error" style="color: var(--color-error); font-size: 13px; margin-top: 8px;"></div>
    </form>

    <div class="register-link">
      还没有账号？去 <a href="register.html?admin=true">注册</a>
    </div>
  </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/jquery-validate/1.19.3/jquery.validate.min.js"></script>
<script src="https://cdn.staticfile.org/twitter-bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="./js/toastr.min.js"></script>
<script>
  // 密码登录
  $('#loginForm').validate({
    rules: {
      phoneNumber: 'required',
      password: { required: true, minlength: 6 }
    },
    messages: {
      phoneNumber: '请输入您的手机号',
      password: { required: '请输入密码', minlength: '密码长度至少为6个字符' }
    },
    submitHandler: function(form) {
      var loginName = $('#phoneNumber').val();
      var password = $('#password').val();
      $('.error').text('');
      $.ajax({
        url: '/password/login',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ loginName: loginName, password: password, mandatoryIdentity: 'ADMIN' }),
        success: function(result) {
          if (result.code != 200) {
            alert('登录失败！' + result.msg);
          } else {
            localStorage.setItem('user_token', result.data.token);
            localStorage.setItem('user_identity', 'ADMIN');
            location.assign('admin.html');
          }
        }
      });
      return false;
    }
  });

  // Tab 切换
  $('.tab-box span').click(function(e) {
    var formId = '#' + e.target.dataset.form;
    $(this).addClass('active');
    $(this).siblings().removeClass('active');
    $('form').hide();
    $(formId).show();
  });

  // 获取验证码
  var timer = null;
  $('#getVerificationCode').click(function(e) {
    var txt = $(this).text();
    var num = 60;
    if (txt.indexOf('获取') !== -1) {
      $('#getVerificationCode').text(num + 's');
      getCode();
      timer && clearInterval(timer);
      timer = setInterval(function() {
        if (num > 1) {
          num--;
          $('#getVerificationCode').text(num + 's');
        } else {
          timer && clearInterval(timer);
          $('#getVerificationCode').text('重新获取');
        }
      }, 1000);
    }
  });

  function getCode() {
    $.ajax({
      url: '/verification-code/send',
      type: 'GET',
      data: { phoneNumber: $('#loginMobile').val() },
      success: function(result) {
        if (result.code != 200) {
          timer && clearInterval(timer);
          $('#getVerificationCode').text('重新获取');
          toastr.error('验证码获取失败');
        } else {
          toastr.success('验证码发送成功');
        }
      }
    });
  }

  // 验证码登录
  $('#codeForm').validate({
    rules: {
      loginMobile: 'required',
      verificationCode: 'required'
    },
    messages: {
      loginMobile: '请输入您的手机号',
      verificationCode: '请输入验证码'
    },
    submitHandler: function(form) {
      var loginMobile = $('#loginMobile').val();
      var verificationCode = $('#verificationCode').val();
      $('.error').text('');
      $.ajax({
        url: '/message/login',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ loginMobile: loginMobile, verificationCode: verificationCode, mandatoryIdentity: 'ADMIN' }),
        success: function(result) {
          if (result.code != 200) {
            alert('登录失败！' + result.msg);
          } else {
            localStorage.setItem('user_token', result.data.token);
            localStorage.setItem('user_identity', 'ADMIN');
            location.assign('admin.html');
          }
        }
      });
      return false;
    }
  });
</script>
</body>
</html>
