<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>后台管理 - 抽奖系统</title>
  <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/base.css">
  <style>
    /* ================================
       后台管理框架 - Playful Geometric
       ================================ */
    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
    }

    .admin-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--color-bg);
    }

    /* --- 顶栏 --- */
    .admin-page .header-box {
      height: 72px;
      background-color: var(--color-card);
      width: 100%;
      display: flex;
      align-items: center;
      padding-left: 28px;
      padding-right: 28px;
      box-sizing: border-box;
      justify-content: space-between;
      border-bottom: 2px solid var(--color-fg);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    /* LOGO 区域 */
    .header-box .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 替代 logo 图片：用纯 CSS 绘制几何 LOGO */
    .header-box .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--color-accent);
      border-radius: 10px;
      border: 2px solid var(--color-fg);
      box-shadow: 3px 3px 0px var(--color-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-box .logo-mark span {
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      font-family: var(--font-heading);
      line-height: 1;
    }

    .header-box .logo-text {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 800;
      color: var(--color-fg);
      letter-spacing: -0.3px;
    }

    /* 用户区域 */
    .header-box .user-box {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-box .logout-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--color-fg);
      background: transparent;
      border: 2px solid var(--color-fg);
      border-radius: var(--radius-full);
      padding: 6px 14px;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--color-fg);
      transition: all 0.25s var(--ease-bounce);
      font-family: var(--font-body);
    }

    .header-box .logout-btn:hover {
      background-color: var(--color-secondary);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--color-fg);
    }

    /* --- 主体布局 --- */
    .admin-page .cont-box {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* --- 侧边栏（深色）--- */
    .admin-page .sidebar {
      width: 220px;
      flex-shrink: 0;
      height: 100%;
      background-color: var(--color-fg); /* 深石板色 */
      padding: 20px 12px;
      overflow-x: hidden;
      overflow-y: auto;
      border-right: 0px;
    }

    /* 侧边栏分类标题 */
    .sidebar-section-title {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #475569;
      padding: 8px 12px 4px;
      margin-top: 8px;
    }

    /* 导航项 */
    .admin-page .nav-link {
      display: flex;
      padding: 10px 14px;
      height: 46px;
      text-decoration: none;
      border-radius: var(--radius-sm);
      margin-bottom: 4px;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
      color: #94A3B8; /* 浅灰色未激活 */
      font-family: var(--font-body);
      transition: all 0.2s var(--ease-bounce);
      gap: 10px;
    }

    .admin-page .nav-link .nav-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .admin-page .nav-link:hover {
      background: rgba(139, 92, 246, 0.15);
      color: #C4B5FD;
    }

    /* 一级菜单激活 */
    .nav-link.active {
      background: var(--color-accent) !important;
      color: #fff !important;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
    }

    /* 二级子菜单 */
    .sub-category {
      margin-left: 0;
      padding-left: 16px;
    }

    .sub-category .nav-link {
      height: 38px;
      font-size: 13px;
      font-weight: 500;
      color: #64748B;
      padding-left: 28px;
      position: relative;
    }

    /* 二级菜单左侧竖线 */
    .sub-category .nav-link::before {
      content: '';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #475569;
      transition: background-color 0.2s;
    }

    .sub-category .nav-link.active,
    .sub-category .nav-link:hover {
      background: rgba(139, 92, 246, 0.2);
      color: #C4B5FD !important;
      box-shadow: none;
    }

    .sub-category .nav-link.active::before,
    .sub-category .nav-link:hover::before {
      background-color: var(--color-accent);
    }

    /* 隐藏旧图标 img */
    .nav-link img {
      display: none !important;
    }

    /* --- 内容区域 --- */
    .admin-page .main-content {
      flex: 1;
      background-color: var(--color-bg);
      overflow: hidden;
    }

    .iframe-styles {
      padding: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      background-color: var(--color-bg);
      border: none;
    }
  </style>
</head>
<body class="admin-page">

<!-- 顶部导航栏 -->
<div class="header-box">
  <!-- LOGO -->
  <div class="logo-box">
    <div class="logo-mark"><span>🎲</span></div>
    <span class="logo-text">抽奖系统</span>
  </div>
  <!-- 用户操作 -->
  <div class="user-box">
    <button class="logout-btn" onclick="logout()">
      <span>⬡</span>
      <span>退出登录</span>
    </button>
  </div>
</div>

<div class="cont-box">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <ul class="nav flex-column">
      <!-- 活动管理 -->
      <li class="nav-item">
        <div class="nav-link active huodong" style="cursor:default;">
          <span class="nav-icon">🎯</span>
          <span>活动管理</span>
        </div>
        <ul class="nav flex-column sub-category">
          <li><a class="nav-link" id="activitiesList" data-desc="huodong" href="activities-list.html">活动列表</a></li>
          <li><a class="nav-link" id="createActivity" data-desc="huodong" href="create-activity.html">新建抽奖活动</a></li>
        </ul>
      </li>
      <!-- 奖品管理 -->
      <li class="nav-item">
        <div class="nav-link jiangpin" style="cursor:default;">
          <span class="nav-icon">🎁</span>
          <span>奖品管理</span>
        </div>
        <ul class="nav flex-column sub-category">
          <li><a class="nav-link" data-desc="jiangpin" href="prizes-list.html">奖品列表</a></li>
          <li><a class="nav-link" data-desc="jiangpin" href="create-prizes.html">创建奖品</a></li>
        </ul>
      </li>
      <!-- 人员管理 -->
      <li class="nav-item">
        <div class="nav-link renyuan" style="cursor:default;">
          <span class="nav-icon">👥</span>
          <span>人员管理</span>
        </div>
        <ul class="nav flex-column sub-category">
          <li><a class="nav-link" id="userList" data-desc="renyuan" href="user-list.html">人员列表</a></li>
          <li><a class="nav-link" id="register" data-desc="renyuancreate" href="register.html">注册用户</a></li>
        </ul>
      </li>
    </ul>
  </div>

  <!-- 内容区域 -->
  <div class="main-content">
    <iframe id="contentFrame" src="activities-list.html" class="iframe-styles"></iframe>
  </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
  // 监听子页面 postMessage（活动/用户创建后跳转）
  window.addEventListener('message', function(e) {
    if (e.data && e.data.from) {
      var pages = e.data.from + '?param=' + new Date().getTime();
      $('#contentFrame').attr('src', pages);
      var id = e.data.id;
      $('ul.nav .nav-link').removeClass('active');
      $(id).addClass('active');
      $(id).parent().parent('.sub-category').prev().addClass('active');
    }
  }, false);

  // 导航点击事件
  $('ul.nav a').on('click', function(event) {
    event.preventDefault();
    $('ul.nav .nav-link').removeClass('active');
    $(this).addClass('active');
    $(this).parent().parent('.sub-category').prev().addClass('active');
    var randomParam = new Date().getTime();
    var dataDesc = $(this).data('desc');
    var page = '';
    if (dataDesc === 'renyuancreate') {
      page = $(this).attr('href') + '?param=' + randomParam + '&jumpList=true&admin=false';
    } else {
      page = $(this).attr('href') + '?param=' + randomParam;
    }
    $('#contentFrame').attr('src', page);
  });

  // 默认激活第一个子链接
  $(document).ready(function() {
    $('ul.nav a:first').addClass('active');
  });

  // 退出登录
  function logout() {
    localStorage.removeItem('user_token');
    location.href = '/blogin.html';
  }
</script>
</body>
</html>
