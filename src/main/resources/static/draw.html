<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>抽奖页面</title>
    <link rel="stylesheet" href="./css/base.css">
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            text-align: center;
            background: var(--color-bg);
            background-image: radial-gradient(var(--color-muted) 1px, transparent 1px);
            background-size: 24px 24px;
            overflow: hidden;
            font-family: var(--font-body);
            color: var(--color-fg);
        }

        #container {
            min-width: 1000px;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        /* 给大屏加个波浪状/几何的容器框（可选，这里用简单卡片包起来内容） */
        .glass-box {
            background: #FFFFFF;
            border: 3px solid var(--color-border);
            border-radius: var(--radius-wobbly);
            box-shadow: 8px 8px 0 var(--color-fg);
            transform: rotate(-.7deg);
            padding: 40px;
            margin-top: 5vh;
            width: 80%;
            max-width: 1000px;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #title {
            font-size: 56px;
            font-weight: 800;
            color: var(--color-accent);
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 var(--color-fg);
            letter-spacing: 2px;
            -webkit-text-stroke: 1px var(--color-fg);
            text-transform: uppercase;
        }

        #disc {
            font-size: 32px;
            font-weight: 700;
            margin: 10px 0 20px;
            background: var(--color-tertiary);
            padding: 8px 32px;
            border-radius: 999px;
            border: 3px solid var(--color-border);
            box-shadow: 4px 4px 0 var(--color-fg);
            color: var(--color-fg);
            display: inline-block;
        }

        #image {
            margin-top: 20px;
            height: 240px;
            max-width: 400px;
            object-fit: cover;
            border: 3px solid var(--color-border);
            border-radius: var(--radius-wobbly-md);
            box-shadow: 5px 5px 0 var(--color-accent);
            display: none;
            background-color: #fff;
        }

        #list {
            margin: 20px auto 0;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            flex: 1;
            align-items: center;
            align-content: center;
        }

        /* 闪烁文字 / 抽出来的人名 */
        #list span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2px solid var(--color-border);
            padding: 12px 24px;
            font-size: 28px;
            font-weight: 800;
            border-radius: var(--radius-wobbly);
            box-shadow: 4px 4px 0 var(--color-secondary);
            min-width: 160px;
            color: var(--color-fg);
        }

        /* 中奖名单样式 */
        .records-item {
            flex-direction: column !important;
            gap: 12px !important;
            max-height: 400px;
            overflow-y: auto;
            justify-content: flex-start !important;
            align-content: flex-start !important;
        }

        .records-item div {
            background: #fff;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-wobbly-sm);
            padding: 12px 24px;
            width: 100%;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            box-shadow: 3px 3px 0 var(--color-secondary);
        }

        /* 操作按钮 */
        .opt-box {
            display: flex;
            gap: 24px;
            margin-top: 30px;
        }

        .opt-box .btn {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 18px;
            padding: 12px 32px;
            background: #fff;
            color: var(--color-fg);
            border: 3px solid var(--color-border);
            border-radius: var(--radius-wobbly);
            box-shadow: 4px 4px 0 var(--color-fg);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .opt-box .btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 2px 2px 0 var(--color-fg);
            background: var(--color-accent);
        }

        .opt-box .btn.pre-btn {
            background: var(--color-muted);
        }

        .opt-box .btn.pre-btn:hover {
            background: var(--color-secondary);
        }

        .opt-box .btn.copy-btn {
            background: var(--color-tertiary);
        }

        .opt-box .btn.copy-btn:hover {
            background: #C69B00;
        }

        /* 隐藏原版滚动条 */
        .records-item::-webkit-scrollbar {
            width: 8px;
        }

        .records-item::-webkit-scrollbar-thumb {
            background: #121212;
            border-radius: 4px;
        }

        @media (max-width: 700px) {
            body {
                overflow-y: auto;
            }

            #container {
                min-width: 0;
                min-height: 100%;
                padding: 16px;
            }

            .glass-box {
                width: 100%;
                min-height: calc(100vh - 32px);
                margin-top: 0;
                padding: 24px 16px;
                box-shadow: 8px 8px 0px #121212;
            }

            #title {
                font-size: 38px;
            }

            #disc {
                font-size: 22px;
                padding: 8px 16px;
            }

            #image {
                height: 180px;
                max-width: 100%;
            }

            #list span {
                min-width: 0;
                width: 100%;
                font-size: 22px;
            }

            .opt-box {
                width: 100%;
                gap: 12px;
            }

            .opt-box .btn {
                flex: 1;
                padding: 12px 8px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <div id="container">
        <div class="glass-box">
            <div id="title"></div>
            <div id="disc"></div>
            <img id="image" />
            <div id="list"></div>
            <div class="opt-box">
                <span class="btn pre-btn" onclick="previousStep()">上一奖项</span>
                <span class="btn next-btn" onclick="nextStep()">开始抽奖</span>
            </div>
        </div>
    </div>
    <script src="/js/jquery-3.6.0.min.js"></script>
    <script>
        var params = new URLSearchParams(window.location.search);
        var activityId = params.get('activityId');
        var valid = params.get('valid');
        var userToken = localStorage.getItem("user_token");

        var disc = document.getElementById('disc')
        var image = document.getElementById('image')
        var list = document.getElementById('list')

        var steps = null
        var step = 0
        var names = null
        var state = ''
        var isWaitingForWinnerResult = false
        var winnerResultPollTimer = null
        var WINNER_RESULT_POLL_INTERVAL = 300
        var WINNER_RESULT_MAX_ATTEMPTS = 27

        document.addEventListener('DOMContentLoaded', function () {
            var titleDiv = document.getElementById('title');
            var activityName = params.get('activityName');
            titleDiv.textContent = activityName;
        });

        function formatDate(dateString) {
            var date = new Date(dateString);
            var hour = ('0' + date.getHours()).slice(-2);
            var minute = ('0' + date.getMinutes()).slice(-2);
            var second = ('0' + date.getSeconds()).slice(-2);
            return hour + ':' + minute + ':' + second;
        }

        function showPic(data) {
            disc.style.display = 'inline-block';
            disc.innerHTML = data.prizeTierName + ' - ' + data.name + ' (' + data.prizeAmount + '份)'
            image.src = data.imageUrl ? data.imageUrl : '/pic/defaultPrizeImg.png'
            image.style.display = 'block'
            list.style.display = 'none'
            while (list.hasChildNodes()) { list.removeChild(list.firstChild) }
        }

        function showRecords() {
            disc.style.display = 'inline-block';
            disc.innerHTML = "🎉 中奖名单 🎉"
            image.style.display = 'none'
            list.style.display = 'flex'
            while (list.hasChildNodes()) { list.removeChild(list.firstChild) }

            $.ajax({
                url: '/winning-records/show',
                type: 'POST',
                dataType: 'json',
                contentType: 'application/json',
                data: JSON.stringify({ activityId: activityId }),
                headers: { 'user_token': userToken },
                success: function (result) {
                    if (result.code != 200) {
                        alert("查询中奖记录失败！" + result.msg);
                    } else {
                        var records = result.data
                        list.className = "records-item"
                        for (var i = 0; i < records.length; ++i) {
                            var item = document.createElement('div')
                            // 分别包裹以美化展示
                            item.innerHTML = `
                            <span>${formatDate(records[i].winningTime)}</span>
                            <span style="color:#ff4d4d;">${records[i].winnerName}</span>
                            <span>${records[i].prizeTier} - ${records[i].prizeName}</span>
                        `;
                            list.appendChild(item)
                        }

                        var optBox = document.querySelector('.opt-box');
                        var existingBtn = optBox.querySelector('.btn.copy-btn');
                        if (!existingBtn) {
                            var newBtn = document.createElement('span');
                            newBtn.className = 'btn copy-btn';
                            newBtn.onclick = function () {
                                var currentUrl = new URL(window.location);
                                var searchParams = currentUrl.searchParams;
                                searchParams.delete('valid');
                                searchParams.append('valid', false);
                                searchParams.delete('hideButton');
                                searchParams.append('hideButton', true);
                                currentUrl.search = searchParams.toString();
                                copyToClipboard(currentUrl);
                            };
                            newBtn.textContent = '分享结果';
                            optBox.appendChild(newBtn);
                        }

                        var hideButton = params.get('hideButton');
                        if ((hideButton == null && valid === 'false') || hideButton === 'true') {
                            var buttons = document.querySelectorAll('.btn.pre-btn, .btn.next-btn');
                            buttons.forEach(function (button) { button.style.display = 'none'; });
                        }
                    }
                }
            });
        }

        function copyToClipboard(textToCopy) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(textToCopy).then(() => { alert("链接已复制到剪贴板"); });
            } else {
                let textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                textArea.style.position = "absolute";
                textArea.style.opacity = 0;
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                return new Promise((res, rej) => {
                    document.execCommand('copy') ? res() : rej();
                    textArea.remove();
                    alert("链接已复制到剪贴板");
                });
            }
        }

        function showBlink(data) {
            disc.innerHTML = data.prizeTierName + ' - ' + data.name + ' (' + data.prizeAmount + '份)'
            image.style.display = 'none'
            list.style.display = 'flex'
            list.className = ""
            var spans = []
            for (var i = 0; i < data.prizeAmount; ++i) {
                var span = document.createElement('span')
                list.appendChild(span)
                spans.push(span)
            }

            function doBlink() {
                if (state == 'showBlink') {
                    names.sort(function (a, b) { return 0.5 - Math.random() })
                    for (var i = 0; i < Math.min(data.prizeAmount, names.length); ++i) {
                        spans[i].innerHTML = names[i].userName
                    }
                    window.requestAnimationFrame(doBlink)
                }
            }
            window.requestAnimationFrame(doBlink)
        }

        function renderWinnerList(data) {
            while (list.hasChildNodes()) { list.removeChild(list.firstChild) }
            for (var i = 0; i < data.list.length; ++i) {
                var span = document.createElement('span')
                span.style.boxShadow = "6px 6px 0px #FBBF24";
                span.innerHTML = '🎉 ' + data.list[i].userName
                list.appendChild(span)
            }
        }

        function applyWinnerRecords(data, luckRecords) {
            var winnerIds = luckRecords.map(function (luckRecord) { return luckRecord.winnerId; });
            data.list = luckRecords.map(function (luckRecord) {
                return { userId: luckRecord.winnerId, userName: luckRecord.winnerName };
            });
            names = names.filter(function (name) { return !winnerIds.includes(name.userId); });
            renderWinnerList(data)
        }

        function showWinnerResultPending(data, message) {
            disc.innerHTML = data.prizeTierName + ' - ' + data.name + ' (' + data.prizeAmount + '份)'
            image.style.display = 'none'
            list.style.display = 'flex'
            list.className = ""
            while (list.hasChildNodes()) { list.removeChild(list.firstChild) }
            var pending = document.createElement('span')
            pending.innerHTML = message
            list.appendChild(pending)
        }

        function queryWinnerRecords(data, callback) {
            $.ajax({
                url: '/winning-records/show',
                type: 'POST',
                dataType: 'json',
                contentType: 'application/json',
                headers: { 'user_token': userToken },
                data: JSON.stringify({ activityId: activityId, prizeId: data.prizeId }),
                success: function (result) {
                    if (result.code != 200) {
                        alert("查询中奖记录失败！" + result.msg);
                    } else {
                        callback(result.data)
                    }
                }
            });
        }

        function waitForWinnerResult(data) {
            if (winnerResultPollTimer) {
                clearTimeout(winnerResultPollTimer)
                winnerResultPollTimer = null
            }
            isWaitingForWinnerResult = true
            showWinnerResultPending(data, '正在确认中奖结果…')
            changeNextButtonText('正在确认结果…')

            var attempts = 0
            function poll() {
                queryWinnerRecords(data, function (luckRecords) {
                    if (luckRecords.length === data.prizeAmount) {
                        isWaitingForWinnerResult = false
                        winnerResultPollTimer = null
                        applyWinnerRecords(data, luckRecords)
                        changeNextButtonText('已抽完，下一步')
                        return
                    }

                    attempts++
                    if (attempts >= WINNER_RESULT_MAX_ATTEMPTS) {
                        winnerResultPollTimer = null
                        showWinnerResultPending(data, '结果处理中，请点击“重新查询结果”')
                        changeNextButtonText('重新查询结果')
                        return
                    }
                    winnerResultPollTimer = window.setTimeout(poll, WINNER_RESULT_POLL_INTERVAL)
                })
            }
            poll()
        }

        function showList(data) {
            disc.innerHTML = data.prizeTierName + ' - ' + data.name + ' (' + data.prizeAmount + '份)'
            image.style.display = 'none'
            list.style.display = 'flex'
            list.className = ""
            while (list.hasChildNodes()) { list.removeChild(list.firstChild) }

            data.list = data.list || []
            if (data.list.length > 0) {
                renderWinnerList(data)
            } else {
                waitForWinnerResult(data)
            }
        }

        function changeNextButtonText(text) {
            var nextButton = document.querySelector('.btn.next-btn');
            if (nextButton) nextButton.textContent = text;
        }

        function saveLuck(data, callback) {
            $.ajax({
                url: '/draw-prize',
                type: 'POST',
                dataType: 'json',
                contentType: 'application/json',
                headers: { 'user_token': userToken },
                data: JSON.stringify({ activityId: activityId, prizeId: data.prizeId, winningTime: new Date() }),
                success: function (result) {
                    if (result.code != 200) {
                        alert("抽奖失败！" + result.msg);
                    } else {
                        if (callback) callback();
                    }
                },
                error: function (err) {
                    if (err != null && err.status == 401) {
                        alert("用户未登录!");
                        location.href = "/blogin.html";
                    }
                }
            });
        }

        function nextStep() {
            if (!steps || steps.length === 0) return;
            var data = steps[step]
            if (isWaitingForWinnerResult) {
                waitForWinnerResult(data)
                return
            }
            if (state == 'showPic') {
                if (data.valid) {
                    state = 'showBlink'
                    showBlink(data)
                    changeNextButtonText('点击停止滚动')
                } else {
                    state = 'showList'
                    showList(data)
                    changeNextButtonText('已抽完，下一步')
                }
            } else if (state == 'showBlink') {
                data.list = []
                data.valid = false
                state = 'showList'
                saveLuck(data, function () {
                    waitForWinnerResult(data)
                })
            } else if (state == 'showList') {
                if (step < (steps.length - 1)) {
                    ++step
                    state = ''
                    nextStep()
                    changeNextButtonText('开始下一轮')
                } else {
                    if (step == (steps.length - 1)) { ++step }
                    showRecords()
                    changeNextButtonText('已全部抽完')
                }
            } else {
                state = 'showPic'
                showPic(data)
                changeNextButtonText('滚滚动动 🎲')
            }
        }

        function previousStep() {
            if (isWaitingForWinnerResult) return
            if (step > 0) { --step }
            state = ''
            nextStep()
        }

        function drawPage() {
            if (valid == "true") {
                var identity = localStorage.getItem("user_identity");
                if (identity == "ADMIN") {
                    reloadConf(nextStep)
                } else {
                    disc.innerHTML = "提示";
                    disc.style.display = 'inline-block';
                    list.style.display = 'none';
                    image.style.display = 'none';
                    document.querySelector('.opt-box').style.display = 'none';
                    var msg = document.createElement('h3');
                    msg.style.color = '#121212';
                    msg.textContent = "抽奖未结束，由于您不是管理员，无权限参与抽奖。请耐心等待抽奖结束后查看中奖名单";
                    document.querySelector('.glass-box').appendChild(msg);
                }
            } else {
                showRecords()
            }
        }

        function reloadConf(func) {
            $.ajax({
                url: '/activity-detail/find',
                type: 'GET',
                data: { activityId: activityId },
                dataType: 'json',
                headers: { 'user_token': userToken },
                success: function (result) {
                    if (result.code != 200) {
                        alert("获取活动详情失败！" + result.msg);
                    } else {
                        names = result.data.users;
                        steps = result.data.prizes;
                        if (func) func();
                    }
                },
                error: function (err) {
                    if (err != null && err.status == 401) {
                        alert("用户未登录!");
                        location.href = "/blogin.html";
                    }
                }
            });
        }

        drawPage()
    </script>
</body>

</html>
