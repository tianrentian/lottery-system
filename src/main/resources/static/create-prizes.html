<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>创建奖品</title>
    <link rel="stylesheet" href="/css/bootstrap-4.5.2.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <style>
        body {
            padding: 0 32px 32px;
            background-color: var(--color-bg);
            font-family: var(--font-body);
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 32px 36px;
            background-color: var(--color-card);
            border: 2px solid var(--color-fg);
            border-radius: var(--radius-wobbly-md);
            box-shadow: 8px 8px 0px 0px var(--color-fg);
        }
        .container h2 {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.5px;
            color: var(--color-fg);
            text-align: center;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .upload-box {
            display: flex;
            width: 140px;
            height: 140px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed var(--color-accent);
            background-color: var(--color-tertiary);
            cursor: pointer;
            margin-bottom: 10px;
            position: relative;
            border-radius: var(--radius-wobbly-md);
            overflow: hidden;
            transition: all 0.2s;
        }
        .upload-box:hover {
            background-color: #FFFFFF;
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px #121212;
        }
        .plus {
            color: var(--color-accent);
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 4px;
        }
        .up-txt {
            font-weight: 600;
            font-size: 13px;
            color: var(--color-accent);
        }
        .upload-box .form-control-file {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            z-index: 2;
            cursor: pointer;
        }
        .preview-img {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: none;
            background-color: #fff;
            object-fit: scale-down;
        }
        .btn-submit {
            margin-top: 32px;
        }
    </style>
</head>
<body>
<div class="container geo-card">
    <h2>🎁 创建奖品</h2>
    <div id="prizeRows">
        <div class="prize-row">
            <div class="form-group">
                <label for="prizeName">奖品名称</label>
                <input class="form-control" type="text" placeholder="请输入奖品名称" id="prizeName" name="prizeName" required>
            </div>
            <div class="form-group">
                <label>奖品图片</label>
                <div class="img-upload">
                    <div class="upload-box">
                        <span class="plus">+</span>
                        <span class="up-txt">上传图片</span>
                        <img src="" class="preview-img" id="previewImg" alt="">
                        <input class="form-control-file" type="file" onchange="showImg()" id="prizeImageUrl" accept="image/*">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="price">奖品价值</label>
                <input class="form-control" placeholder="请输入奖品价值金额" type="number" id="price" name="price" required>
            </div>
            <div class="form-group">
                <label for="description">奖品描述</label>
                <textarea class="form-control" id="description" placeholder="请输入奖品描述信息" name="description" required></textarea>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-submit" onclick="submitPrizes()">立刻创建</button>
</div>

<script src="/js/jquery-3.6.0.min.js"></script>
<script>
    var userToken = localStorage.getItem("user_token");
    var formData = new FormData();

    function submitPrizes() {
        var prizeName = $('#prizeName').val();
        var description = $('#description').val();
        var price = $('#price').val();
        
        if (!prizeName || !price) {
            alert('请完善必填信息');
            return;
        }
        
        formData.append("param", JSON.stringify({
            prizeName: prizeName,
            description: description,
            price: price,
        }));

        $.ajax({
             url: '/prize/create',
             type: 'POST',
             contentType : false,
             processData : false,
             headers: { "user_token": userToken },
             data: formData,
             success: function(result) {
                 if(result.code == 200) {
                     alert('奖品创建成功！');
                     // 可能需要通知父页面或者重置表单
                     window.location.reload();
                 } else {
                     alert('创建奖品失败：' + result.msg);
                 }
             },
             error: function(err){
                 if(err!=null && err.status==401){
                     alert("用户未登录, 即将跳转到登录页!");
                     window.parent.location.href = "/blogin.html";
                 }
             }
         });
    }

    function showImg() {
        var fileInput = document.getElementById("prizeImageUrl");
        var file = fileInput.files[0];
        if (!file) return;
        
        formData.append("prizePic", file);
        var r = new FileReader();
        r.readAsDataURL(file);
        r.onload = function(e) {
            $('#previewImg').attr("src", e.target.result).show();
        }
    }
</script>
</body>
</html>
