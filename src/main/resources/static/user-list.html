<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人员列表</title>
    <link rel="stylesheet" href="/css/bootstrap-4.5.2.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <style>
        body {
            padding: 0 32px 32px;
            background-color: var(--color-bg);
            font-family: var(--font-body);
        }
        .user-table h2 {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 24px;
            color: var(--color-fg);
            height: 80px;
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .table-box {
            height: calc(100vh - 120px); /* 人员列表无分页，稍微改高点 */
            overflow-y: auto;
            background: var(--color-card);
            border: 2px solid var(--color-fg);
            border-radius: var(--radius-wobbly-md);
            box-shadow: var(--shadow-pop-lg);
        }
        .table-box::-webkit-scrollbar {
            width: 8px;
        }
        .table-box::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: var(--radius-wobbly-sm);
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            position: sticky;
            top: 0px;
            z-index: 10;
        }
        .user-table th, .user-table td {
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="user-table">
    <h2>人员列表</h2>
    <div class="table-box">
        <table class="table">
            <thead>
            <tr>
                <th style="width: 25%">人员ID</th>
                <th style="width: 50%">姓名</th>
                <th style="width: 25%">身份</th>
            </tr>
            </thead>
            <tbody id="userList">
            <!-- 人员列表将动态插入这里 -->
            </tbody>
        </table>
    </div>
</div>

<script src="/js/jquery-3.6.0.min.js"></script>
<script>
    var userToken = localStorage.getItem("user_token");

    function fetchUserData() {
        $.ajax({
            url: '/base-user/find-list',
            type: 'GET',
            headers: { "user_token": userToken },
            success: function(result) {
                if (result.code != 200) {
                    alert("查询用户列表失败！" + result.msg);
                } else {
                    var users = result.data;
                    var userList = $('#userList');
                    userList.empty();
                    users.forEach(function(user) {
                        var roleBadge = user.identity === 'ADMIN' ? 
                            '<span class="badge-active bg-danger text-white border-0">管理员</span>' : 
                            '<span class="badge-active bg-info text-white border-0">普通用户</span>';
                        userList.append('<tr> ' +
                        '<td>' + user.userId + '</td>' +
                        '<td>' + user.userName + '</td>' +
                        '<td>' + roleBadge + '</td>' +
                        '</tr>');
                    });
                }
            },
            error: function(err){
                if(err!=null && err.status==401){
                    alert("用户未登录, 即将跳转到登录页!");
                    window.parent.location.href = "/blogin.html";
                }
            }
        });
    }

    $(document).ready(function() {
        fetchUserData();
    });

</script>
</body>
</html>
