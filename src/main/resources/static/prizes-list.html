<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>奖品列表</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <style>
    body {
      padding: 0 32px 32px;
      background-color: var(--color-bg);
      font-family: var(--font-body);
    }
    .prize-table h2 {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 24px;
      color: var(--color-fg);
      height: 80px;
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .table-box {
      height: calc(100vh - 150px);
      overflow-y: auto;
      background: var(--color-card);
      border: 2px solid var(--color-fg);
      border-radius: var(--radius-wobbly-md);
      box-shadow: var(--shadow-pop-lg);
    }
    /* 隐藏滚动条但保留功能 */
    .table-box::-webkit-scrollbar {
      width: 8px;
    }
    .table-box::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: var(--radius-wobbly-sm);
    }
    .table {
      margin-bottom: 0;
    }
    .table thead th {
      position: sticky;
      top: 0px;
      z-index: 10;
    }
    .prize-table th, .prize-table td {
        text-align: center;
        vertical-align: middle;
    }
    .prize-table img {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-wobbly-sm);
      object-fit: scale-down;
      border: 2px solid var(--color-border);
      background-color: #fff;
    }
    .prize-table td {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 300px;
    }
    </style>
</head>
<body>
<div class="prize-table">
    <h2>奖品列表</h2>
    <div class="table-box">
      <table class="table">
        <thead>
        <tr>
            <th style="width: 15%">奖品ID</th>
            <th style="width: 20%">奖品图</th>
            <th style="width: 15%">奖品名</th>
            <th style="width: 35%">奖品描述</th>
            <th style="width: 15%">奖品价值</th>
        </tr>
        </thead>
        <tbody id="prizeList">
            <!-- 奖品列表将动态插入这里 -->
        </tbody>
      </table>
    </div>
    <div class="pagination">
        <button onclick="fetchPrizes(1)">首页</button>
        <button onclick="previousPage()">上一页</button>
        <span>第 <input type="number" id="pageInput" min="1" value="1" /> 页</span>
        <button onclick="nextPage()">下一页</button>
        <button onclick="fetchPrizes(totalPages)">尾页</button>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    var userToken = localStorage.getItem("user_token");
    var currentPage = 1;
    var pageSize = 10;
    var totalPages;

    function fetchPrizes(page) {
      if (page < 1) page = 1;
      currentPage = page;
      var dataToSend = { currentPage: currentPage, pageSize: pageSize };

      $.ajax({
          url: '/prize/find-list',
           type: 'GET',
           data: dataToSend,
           headers: { "user_token": userToken },
          dataType: 'json',
          success: function(result) {
            if (result.code != 200) {
                alert("查询奖品列表失败！" + result.msg);
            } else {
                var prizes = result.data.records;
                var prizeList = $('#prizeList');
                prizeList.empty();
                prizes.forEach(function(prize) {
                    var imageUrl = prize.imageUrl ? prize.imageUrl : '/pic/defaultPrizeImg.png';
                    prizeList.append('<tr> ' +
                            '<td>' + prize.prizeId + '</td>' +
                            '<td><img src="' + imageUrl + '" alt="' + prize.prizeName + '" class="prize-image"></td>' +
                            '<td>' + prize.prizeName + '</td>' +
                            '<td>' + prize.description + '</td>' +
                            '<td>' + prize.price + '元</td>' +
                            '</tr>');
                });
                totalPages = Math.ceil(result.data.total / pageSize);
                $('#pageInput').val(currentPage);
              }
          },
          error:function(err){
              if(err!=null && err.status==401){
                  alert("用户未登录, 即将跳转到登录页!");
                  window.location.href = "/blogin.html";
                  window.parent.location.href = "/blogin.html";
              }
          }
      });
    }

    function previousPage() {
      if (currentPage > 1) fetchPrizes(currentPage - 1);
      else alert("已经是第一页");
    }

    function nextPage() {
      if (currentPage < totalPages) fetchPrizes(currentPage + 1);
      else alert("已经是最后一页");
    }

    $(document).ready(function() {
      fetchPrizes(1);
    });

    $('#pageInput').on('keypress', function(e) {
      if (e.key === 'Enter') {
        var page = parseInt(this.value, 10);
        if (!isNaN(page) && page >= 1 && page <= totalPages) {
          fetchPrizes(page);
        }
      }
    });

</script>
</body>
</html>
