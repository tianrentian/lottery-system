spring.application.name=lottery-system

## logback xml ##
logging.config=classpath:logback-spring.xml

## MySql ##
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/lottery_system?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}

## MyBatis ##
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.example.lotterysystem.dao.handler

## SMS ##
sms.access-key-id=${SMS_ACCESS_KEY_ID:}
sms.access-key-secret=${SMS_ACCESS_KEY_SECRET:}
sms.sign-name=${SMS_SIGN_NAME:速通互联验证码}

## Redis ##
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60s
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=5s

## Picture upload ##
pic.local-path=${PIC_LOCAL_PATH:/PIC}
spring.web.resources.static-locations=classpath:/static/,file:${pic.local-path}

## RabbitMQ ##
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.prefetch=2

## Mail ##
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.username=${MAIL_USERNAME:2532431590@qq.com}
spring.mail.password=${MAIL_AUTH_CODE:}
spring.mail.default-encoding=UTF-8
spring.mail.port=${MAIL_PORT:465}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

## Thread pool ##
async.executor.thread.core_pool_size=${ASYNC_CORE_POOL_SIZE:10}
async.executor.thread.max_pool_size=${ASYNC_MAX_POOL_SIZE:20}
async.executor.thread.queue_capacity=${ASYNC_QUEUE_CAPACITY:20}
async.executor.thread.name.prefix=async-service-

## LangChain4j - DeepSeek ##
langchain4j.open-ai.chat-model.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY:}
langchain4j.open-ai.chat-model.model-name=${DEEPSEEK_MODEL_NAME:deepseek-v4-flash}
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false
langchain4j.open-ai.chat-model.max-tokens=${DEEPSEEK_MAX_TOKENS:1000}

## DingTalk robot ##
wechat.robot.webhook-url=${DINGTALK_WEBHOOK_URL:}
